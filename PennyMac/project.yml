# XcodeGen spec — run `xcodegen generate` in this folder to (re)create Penny.xcodeproj.
# The .xcodeproj is generated; edit THIS file, not the project.
name: Penny
options:
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"

packages:
  PennyCore:
    path: PennyCore

targets:
  Penny:
    type: application
    platform: macOS
    sources:
      - PennyApp
      # Deterministic-parser resources, bundled into the sandboxed app:
      # categories.json (categorization) + bank_profiles/ (bank detection).
      # Kept as a folder reference so bank_profiles/ stays a real directory
      # that BankProfileRegistry(dir:) can enumerate at runtime.
      - path: Resources/categories.json
        buildPhase: resources
      - path: Resources/bank_profiles
        type: folder
        buildPhase: resources
    dependencies:
      - package: PennyCore
        product: PennyCore
      # The deterministic statement parser (MuPDF-parity, 15/15 conformance).
      # Direct product dep so PennyApp can `import PennyTxnStore`.
      - package: PennyCore
        product: PennyTxnStore
      # L1 canonical model (Phase 0 · Task 0.1 scaffold; real types land in 0.2).
      # Wired now so PennyApp can `import PennyModel` from Task 0.7 onward.
      - package: PennyCore
        product: PennyModel
      # L2–L4 deterministic Query Engine (Phase 1.1 runtime integration): the app
      # routes questions through PennyFinance's engine before the legacy router.
      - package: PennyCore
        product: PennyFinance
    # Fix #2 — guarantee MLX's Metal shader library ships inside Penny.app.
    # MLX loads `mlx-swift_Cmlx.bundle/Contents/Resources/default.metallib` to init
    # its Metal backend; without it, Metal aborts with SIGTRAP in
    # ~MTLLibraryDataWithArchive (the crash seen on client machines). Xcode's SwiftPM
    # integration normally embeds that bundle automatically, but this run-script is a
    # belt-and-braces safety net: if the metallib isn't already in the app's
    # Resources, find it in the build products and copy it in. Runs after the default
    # phases assemble the bundle and before code signing, so the copy is signed.
    postBuildScripts:
      - name: "Embed MLX default.metallib (safety net)"
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          APP_RES="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          DEST="${APP_RES}/mlx-swift_Cmlx.bundle/Contents/Resources/default.metallib"
          if [ -f "${DEST}" ]; then
            echo "note: default.metallib already embedded — nothing to do"
            exit 0
          fi
          SRC="$(/usr/bin/find "${BUILT_PRODUCTS_DIR}" -name default.metallib -path '*mlx-swift_Cmlx.bundle*' -print -quit 2>/dev/null || true)"
          if [ -z "${SRC}" ]; then
            echo "warning: default.metallib not found in build products; MLX fallback may fail to init Metal"
            exit 0
          fi
          BUNDLE_DIR="${SRC%/Contents/Resources/default.metallib}"
          echo "note: embedding $(/usr/bin/basename "${BUNDLE_DIR}") into ${APP_RES}"
          /bin/mkdir -p "${APP_RES}"
          /bin/cp -R "${BUNDLE_DIR}" "${APP_RES}/"
    info:
      path: PennyApp/Info.plist
      properties:
        CFBundleName: Penny
        CFBundleDisplayName: Penny
        LSApplicationCategoryType: public.app-category.finance
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "1.1.0"
        CFBundleIconFile: icon.icns
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: PennyApp/Penny.entitlements
      properties:
        # App Sandbox ON — the whole point of this rewrite. No JIT entitlements anywhere.
        com.apple.security.app-sandbox: true
        # Model weights download (HuggingFace) needs outbound network.
        com.apple.security.network.client: true
        # User picks their statement PDF in the file dialog.
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localbankrag.app
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: P4ANR778GY
        # Mac App Store uses the App Sandbox, NOT the Hardened Runtime.
        ENABLE_HARDENED_RUNTIME: NO
        # No previews debug-dylib: the Penny.debug.dylib stub duplicates the
        # PennyTxnStore classes (objc warnings) and breaks the XCUITest
        # automation channel — app-side AX/testability queries die at the XPC
        # timeout while the app idles.
        ENABLE_DEBUG_DYLIB: NO
      configs:
        # Local dev: automatic signing, dev entitlements (Penny.entitlements from
        # the `entitlements:` block above). Run this config in Xcode day to day.
        Debug:
          CODE_SIGN_STYLE: Automatic
        # Mac App Store / TestFlight (P5): manual signing with the installed
        # "Apple Distribution" cert + "Penny Mac App Store" profile — both already
        # in the keychain, so NO Apple-ID login is needed to archive. Uses the
        # distribution entitlements (adds application-identifier + team-identifier).
        # Archive this config: Product ▸ Archive (scheme's Archive uses Release).
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Penny Mac App Store"
          CODE_SIGN_ENTITLEMENTS: PennyApp/Penny-dist.entitlements

  # Penny for iOS — the same PennyCore brain (deterministic parsers, router,
  # on-device model) wearing the penny_final_1 mockup's design. Lives beside
  # the macOS target; neither affects the other.
  Penny-iOS:
    type: application
    platform: iOS
    sources:
      - PennyiOS
      - path: PennyiOS/Assets.xcassets
        buildPhase: resources
      # Same deterministic-parser resources the macOS app bundles.
      - path: Resources/categories.json
        buildPhase: resources
      - path: Resources/bank_profiles
        type: folder
        buildPhase: resources
    dependencies:
      - package: PennyCore
        product: PennyCore
      - package: PennyCore
        product: PennyTxnStore
    info:
      path: PennyiOS/Info.plist
      properties:
        CFBundleName: Penny
        CFBundleDisplayName: Penny
        LSApplicationCategoryType: public.app-category.finance
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localbankrag.app.ios
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: P4ANR778GY
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_DEBUG_DYLIB: NO
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Automatic

  # Hosted unit tests — app-layer logic (AppModel summaries, markdown/table
  # parser, issuer detection). Injected into the running Penny app process.
  PennyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - PennyTests
      # Real-MLX generation smoke: hosted here because only Xcode builds the
      # Cmlx Metal shader bundle (plain `swift test` can't load MLX), and the
      # sandboxed host app's container is where the model weights live.
      - path: PennyCore/Tests/PennyCoreSmokeTests/LLMSmokeTests.swift
      # Statement corpus for the multi-doc / 1000-question stress tests —
      # bundled as resources because the sandboxed host app can't read the
      # repo checkout at runtime.
      - path: ../finquery/contract/fixtures/Coop_Demo_Statement.pdf
        buildPhase: resources
      - path: ../finquery/contract/fixtures/chase_dummy_statement.pdf
        buildPhase: resources
      - path: ../test-data/DeutscheBank_Demo_Statement.pdf
        buildPhase: resources
      - path: ../test-data/Wrenfield_Bank_Statement_Tinku_Kesariya-1.pdf
        buildPhase: resources
      - path: ../indian_bank_statement.pdf
        buildPhase: resources
    dependencies:
      - target: Penny
      - package: PennyCore
        product: PennyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localbankrag.app.tests
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: P4ANR778GY
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Penny.app/Contents/MacOS/Penny"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # UI automation — drives the real app (onboarding wizard, model picker,
  # dashboard/chat) via XCUITest. The app exposes inert `--uitest` launch
  # hooks so tests never touch real user data or trigger model downloads.
  PennyUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - PennyUITests
    dependencies:
      - target: Penny
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localbankrag.app.uitests
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: P4ANR778GY
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Penny

# Explicit scheme so `xcodebuild test -scheme Penny` runs both bundles.
# Archive stays on Release (the TestFlight/App Store path — see TESTFLIGHT.md).
schemes:
  Penny:
    build:
      targets:
        Penny: all
        PennyTests: [test]
        PennyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PennyTests
        - PennyUITests
      # Hosted tests run inside the real (sandboxed) app process; this flips
      # TestMode.active so they can never persist into the real container.
      # MODEL_READY stubs chat's MLX fallback so the 1000-question stress can
      # exercise every routing path without loading (or downloading) a model.
      environmentVariables:
        PENNY_UITEST: "1"
        PENNY_UITEST_MODEL_READY: "1"
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  Penny-iOS:
    build:
      targets:
        Penny-iOS: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
